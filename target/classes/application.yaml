spring:
  application:
    name: login
  redis:
    host: localhost
    port: 6379
  
  datasource:
    url: jdbc:h2:mem:alunos_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  
  jackson:
    default-property-inclusion: NON_NULL
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
  
  mvc:
    throw-exception-if-no-handler-found: true
  
  data:
    jpa:
      repositories:
        bootstrap-mode: default
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        page-parameter: page
        size-parameter: size
        sort-parameter: sort

jwt:
  secret: "ChangeThisSecretKeyForProdUseAtLeast32Chars!"
  expiration-ms: 300000 #5 minutos

threads:
  virtual:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json

logging:
  level:
    br.com.primeiros.passos: INFO
    org.hibernate:
      SQL: INFO
    org.springframework:
      web: INFO
      data: INFO
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] %c{1} - %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] %c{1} - %m%n"
  file:
    name: logs/login-application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

mapstruct:
  default-component-model: spring
  unmapped-target-policy: WARN
  verbose: true

app:
  config:
    batch-size: 100
    virtual-threads-enabled: true
    validation:
      cpf:
        enabled: true
        timeout: 5000
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5